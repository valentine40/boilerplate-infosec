<style>
/* Раскладка по образцу популярных трекеров: неделя сверху, кольцо с остатком, полоски БЖУ, разделы приёмов пищи с «+», круглая кнопка добавления в центре нижней панели. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --card:#171E27; --ink:#EAEFF5; --mute:#98A4B3; --line:#263040; --soft2:#1F2833;
  --brand:#2FCB93; --brand-ink:#062A1D; --brand-soft:#173B2E; --warm:#FF7A7F; --warm-soft:#3B1E21;
  --p:#7BA5F7; --c:#F6B84E; --f:#F28DA8; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --card:#171E27; --ink:#EAEFF5; --mute:#98A4B3; --line:#263040; --soft2:#1F2833;
  --brand:#2FCB93; --brand-ink:#062A1D; --brand-soft:#173B2E; --warm:#FF7A7F; --warm-soft:#3B1E21;
  --p:#7BA5F7; --c:#F6B84E; --f:#F28DA8; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);margin:0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}

input,select,textarea{font:inherit;color:var(--ink);background:var(--soft2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-width:0}

.mute{color:var(--mute)} .small{font-size:13px} .tiny{font-size:12px}

/* шапка и неделя */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.weekbar{display:grid;grid-template-columns:32px repeat(7,1fr) 32px;gap:4px;align-items:center}

.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;font-size:11px;color:var(--mute);position:relative}

/* итоги */
.ring{position:relative;width:176px;height:176px;margin:2px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}

.entry .n{flex:1;min-width:0} .entry .n b{display:block;font-weight:500;overflow-wrap:anywhere} .entry .n span{font-size:12px;color:var(--mute)}
.entry .k{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.emptyline{padding:2px 0 8px 50px;font-size:13px;color:var(--mute)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}

.item .n{flex:1;min-width:0;overflow-wrap:anywhere} .item .k{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{width:34px;height:34px;border-radius:10px;color:var(--mute);display:grid;place-items:center;flex:none}
.empty{padding:16px 8px;text-align:center;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px}
.sec h2{font:700 17px var(--f-body)}
.timer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}

.timer .ctl{display:flex;gap:10px;width:100%;max-width:380px}
.pbar{width:100%;max-width:360px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}

/* графики и прогресс */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:11px var(--f-body)} .chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--brand);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--brand)} .chart .goal{stroke:var(--warm);stroke-dasharray:4 4;stroke-width:1.5}
.chart .col{fill:var(--brand)} .chart .col.over{fill:var(--warm)} .chart .col.none{fill:var(--soft2)}
.big-num{font:600 34px/1 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column;padding:4px 16px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:0} .mrow span{color:var(--mute);font-size:13px}

/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-items:end}
.tabs button.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--mute);font-size:11px;font-weight:500}
.tabs button.tb[aria-current="true"]{color:var(--brand)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 18px rgba(23,166,115,.45);border:4px solid var(--card)}
.fab .icon{width:26px;height:26px;stroke-width:2.2}

/* шторка */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;overscroll-behavior:contain;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft2);border-radius:14px;padding:4px}
.seg button{padding:9px 0;border-radius:11px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchips button{padding:7px 12px;border-radius:99px;background:var(--soft2);font-size:13px;font-weight:600;color:var(--mute)}
.mchips button[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.pick{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-child{border-top:0} .pick .n{flex:1;min-width:0;overflow-wrap:anywhere} .pick .n span{display:block;font-size:12px;color:var(--mute)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.draft{background:var(--soft2);border-radius:18px;padding:4px 12px}
.drow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)} .drow:first-child{border-top:0}
.drow .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500} .drow .n span{display:block;font-size:12px;color:var(--mute);font-weight:400}
.drow input{width:74px;text-align:center;padding:9px 6px;background:var(--card)}
.drow .star{color:var(--mute)} .drow .star.on{color:var(--c)} .drow .star.on .icon{fill:var(--c)}
.photo{width:100%;max-height:200px;object-fit:cover;border-radius:16px;display:block}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--warm-soft);color:var(--warm);padding:10px 12px;border-radius:12px;font-size:13px}
.ok{background:var(--brand-soft);color:var(--brand);padding:10px 12px;border-radius:12px;font-size:13px}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:180px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;max-width:90%}
/* план недели, уровни, отчёты */
.hero{background:linear-gradient(135deg,var(--brand),#0F7F58);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1C7B5A,#134D3A)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1C7B5A,#134D3A)}}
.hero .lvl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h2{font:700 22px/1.2 var(--f-body);margin:4px 0 2px}
.hero p{opacity:.9;font-size:13px}
.hero .goalline{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px}
.hero .goalline b{font:600 28px var(--f-display);letter-spacing:-.05em}
.hero .bar{background:rgba(255,255,255,.25);margin-top:6px} .hero .bar i{background:#fff}
.plan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.pd{border-radius:14px;padding:8px 0 7px;text-align:center;background:rgba(255,255,255,.14);font-size:11px;line-height:1.25;position:relative;min-width:0}
.pd b{display:block;font-size:12px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.pd.today{background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1.5px #fff}
.pd.done{background:#fff;color:#0F7F58}
.pd.rest{opacity:.65}
.tips{display:flex;flex-direction:column;gap:8px;margin-top:2px}

.tips{padding:0;margin:0}
.pico{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}

.pico.hard{background:var(--warm-soft);color:var(--warm)}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px} .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--brand)}
.chip.rec{background:var(--brand);color:var(--brand-ink)}
.chip.mute{background:var(--soft2);color:var(--mute)}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft2);border-radius:14px;padding:4px}
.subtabs button{padding:9px 0;border-radius:11px;font-size:14px;font-weight:600;color:var(--mute)}
.subtabs button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager .t{font-weight:700;text-align:center;flex:1} .pager .t span{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.pager button{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.pager button[disabled]{opacity:.3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;color:var(--mute);font-size:12px} .tile b{display:block;font:600 22px/1.15 var(--f-display);letter-spacing:-.04em;margin-top:5px;font-variant-numeric:tabular-nums} .tile b span{font:500 12px var(--f-body);color:var(--mute);letter-spacing:0}

.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 6px} .stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)} .legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c1);margin-right:5px}

.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)} .sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)} .sync.ok i{background:var(--brand)} .sync.err i{background:var(--warm)}

}

    case 'fridge': sheet = newFridge(); render(); break;
    case 'fmode': s.mode = id; render(); break;
    case 'doplan': runPlan(); break;
    case 'planadd': addPlanMeal(el.dataset.i); break;
    case 'switch': lset('hudeem-who', ''); location.reload(); break;
    case 'close': closeSheet(); break;
  }
});

/* ---------- старт ---------- */
if (!S.onboarded) sheet = { type: 'profile', p: Object.assign({}, S.profile), kg0: '', first: true };
render();
lastPull = Date.now(); syncNow();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
