}

.pick{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-child{border-top:0} .pick .n{flex:1;min-width:0;overflow-wrap:anywhere} .pick .n span{display:block;font-size:12px;color:var(--mute)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- ИИ: бесплатный Groq через функцию на Netlify ---------- */
const CKEY = 'hudeem-code';
const getCode = () => { try { return localStorage.getItem(CKEY) || ''; } catch { return ''; } };
const setCode = (v) => { try { if (v) localStorage.setItem(CKEY, v); else localStorage.removeItem(CKEY); } catch {} };
const FORMAT = `Ответь ТОЛЬКО одним JSON без пояснений и без markdown:
{"items":[{"name":"продукт или блюдо по-русски","grams":число,"kcal":число,"protein":число,"carbs":число,"fat":число}],"note":"короткое предупреждение, если оценка очень приблизительная, иначе пустая строка"}
Значения kcal, protein, carbs, fat указывай для всей порции в grams (белки, жиры, углеводы в граммах). Если еды нет, верни {"error":"Не нашёл еду"}.`;
const PROMPT_PHOTO = `Ты помогаешь считать калории по фото еды. Определи каждое блюдо на фото, оцени порции по размеру тарелки и приборов. ${FORMAT}`;
const PROMPT_TEXT = (q) => `Оцени пищевую ценность еды, которую описал пользователь: «${q}». Раздели на отдельные продукты или блюда. Если граммы не указаны, возьми типичную порцию. ${FORMAT}`;
const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });

  if (blob) body.image = await toB64(blob);
  const r = await fetch('/.netlify/functions/ai', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-access-code': getCode() }, body: JSON.stringify(body) });
  if (r.status === 401) throw { code: 'code' };
  if (r.status === 429) throw { code: 'rate' };
  const j = await r.json().catch(() => null);
  if (!r.ok || !j) throw { code: (j && j.error === 'setup') ? 'setup' : (j && j.error === 'parse') ? 'parse' : 'http' };

}
function aiError(e, s) {

  if (c === 'rate') return 'Бесплатный лимит запросов исчерпан. Подождите минуту или введите вручную.';
  if (c === 'setup') return 'ИИ ещё не настроен на сервере. Пока можно вводить еду вручную.';
  if (c === 'parse') return 'Не получилось разобрать ответ. Попробуйте ещё раз.';
  if (e instanceof TypeError) return 'Нет связи с интернетом.';
  return 'Не получилось распознать. Попробуйте ещё раз или введите вручную.';
}
function addItems(s, items) {
  (items || []).forEach((it) => {
    const g = Math.max(1, Math.round(n0(it.grams)) || 100);
    s.items.push({ id: rnd(), name: String(it.name || 'Продукт').slice(0, 80), g, k: (n0(it.kcal) / g) * 100, p: (n0(it.protein) / g) * 100, c: (n0(it.carbs) / g) * 100, f: (n0(it.fat) / g) * 100 });
  });
}
async function runAI(kind) {
  const s = sheet;
  if (kind === 'text' && !s.q.trim()) { s.err = 'Напишите, что вы ели, например: гречка 150 г и 2 яйца.'; render(); return; }
  s.nokey = false; s.busy = true; s.err = ''; render();
  try {
    const r = kind === 'text' ? await askAI(null, PROMPT_TEXT(s.q.trim()))

  } catch (e) { s.err = aiError(e, s); if (e && e.code === 'code') s.retry = kind; }

}

async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, k = Math.min(1, 1024 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
}

const kcalFor = (p) => Math.round(p.met * (lastWeight() || 70) * (p.min / 60));
function phases(p) {
  if (p.single) return [{ t: 'work', name: p.ex[0][0], tip: p.ex[0][1], s: p.single }];
  const out = [];
  if (p.warm) out.push({ t: 'rest', name: 'Разминка', tip: p.warm, s: 45 });
  p.ex.forEach((e, i) => { out.push({ t: 'work', name: e[0], tip: e[1], s: p.work, i: i + 1, of: p.ex.length }); if (i < p.ex.length - 1) out.push({ t: 'rest', name: 'Отдых', tip: 'Следующее: ' + p.ex[i + 1][0], s: p.rest }); });

let actx = null, wake = null;
function beep(f = 880, d = 0.12) { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch {} }
async function startTimer(id) {
  const p = PROGRAMS.find((x) => x.id === id); if (!p) return;
  const ph = phases(p);
  timerRun = { p, ph, idx: 0, left: ph[0].s, paused: false, elapsed: 0, last: Date.now() };
  beep(660, 0.2);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch {}
  timerRun.iv = setInterval(tick, 250); render();
}
function tick() {
  const t = timerRun; if (!t || t.paused) { if (t) t.last = Date.now(); return; }
  const now = Date.now(), dt = (now - t.last) / 1000; t.last = now; t.elapsed += dt;
  const before = Math.ceil(t.left); t.left -= dt; const after = Math.ceil(t.left);
  if (before !== after && after > 0 && after <= 3) beep(740, 0.08);
  if (t.left <= 0) {
    if (t.idx >= t.ph.length - 1) return finishTimer(true);
    t.idx++; t.left = t.ph[t.idx].s; beep(t.ph[t.idx].t === 'work' ? 988 : 520, 0.25); return render();
  }
  if (before !== after) paintTimer();
}
function paintTimer() {
  const t = timerRun, ph = t.ph[t.idx], big = document.querySelector('.timer .big'), bar = document.querySelector('.timer .pbar i'); if (!big) return;
  const s = Math.ceil(t.left); big.textContent = ph.s > 99 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s;
  const total = t.ph.reduce((a, b) => a + b.s, 0), doneS = t.ph.slice(0, t.idx).reduce((a, b) => a + b.s, 0) + (ph.s - t.left);

}
function finishTimer(done) {

  const min = Math.max(1, Math.round(t.elapsed / 60)); timerRun = null;

document.addEventListener('change', (e) => { const t = e.target; if (t.tagName === 'SELECT' && t.dataset.p && sheet) { sheet.p[t.dataset.p] = t.dataset.p === 'sex' ? t.value : n0(t.value); paintSuggest(); } });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !sheet || sheet.type !== 'add') return;
  const f = e.target.dataset && e.target.dataset.f;
  if (f === 'q') { e.preventDefault(); e.target.blur(); runAI('text'); } else if (f === 'code') { e.preventDefault(); e.target.blur(); lookup(); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, s = sheet;
  if (a === 'scrim') { if (e.target === el && s && s.type !== 'profile') closeSheet(); return; }
  switch (a) {
    case 'tab': tab = id; window.scrollTo(0, 0); render(); break;
    case 'pickday': day = id; render(); break;
    case 'wk': { const nd = addDays(day, n0(el.dataset.d)); day = nd > ymd() ? ymd() : nd; render(); break; }
    case 'add': sheet = newAdd(id); render(); break;
    case 'setmeal': s.meal = id; render(); break;
    case 'setab': if (s.scanning) stopScan(); s.tab = id; s.err = ''; s.note = ''; render(); break;
    case 'ai': runAI('text'); break;
    case 'ai-photo': runAI('photo'); break;
    case 'shoot': $('#file').click(); break;
    case 'scan': startScan(); break;
    case 'stopscan': stopScan().then(render); break;
    case 'lookup': lookup(); break;
    case 'pick': { const x = pool[n0(el.dataset.i)]; if (x) { s.items.push({ id: rnd(), name: x.name, g: x.g, k: x.k, p: x.p, c: x.c, f: x.f }); s.err = ''; render(); } break; }
    case 'mandd': { const m = s.man, k = n0(m.k); if (!m.name.trim() || k <= 0) { s.err = 'Укажите название и калории на 100 г.'; render(); break; }
      s.items.push({ id: rnd(), name: m.name.trim(), g: n0(m.g) || 100, k, p: n0(m.p), c: n0(m.c), f: n0(m.f) }); s.man = { name: '', g: 100, k: '', p: '', c: '', f: '' }; s.err = ''; s.tab = 'search'; render(); break; }
    case 'rmitem': s.items = s.items.filter((x) => x.id !== id); render(); break;
    case 'star': { const it = s.items.find((x) => x.id === id); if (!it) break; const i = S.foods.findIndex((f) => f.name === it.name);
      if (i >= 0) S.foods.splice(i, 1); else S.foods.push({ id: rnd(), name: it.name, g: it.g, k: it.k, p: it.p, c: it.c, f: it.f }); save(); render(); break; }
    case 'commit': {
      const items = s.items.filter((x) => x.g > 0); if (!items.length) break;
      if (s.edit) { const en = S.meals.find((m) => m.id === s.edit); if (en) { en.g = items[0].g; } save(); sheet = null; say('Сохранено'); break; }
      items.forEach((it) => S.meals.push({ id: rnd(), date: day, meal: s.meal, time: day === ymd() ? hhmm() : '', name: it.name, g: it.g, k: it.k, p: it.p, c: it.c, f: it.f }));
      save(); stopScan(); sheet = null; say('Добавлено'); break; }
    case 'edit': { const en = S.meals.find((m) => m.id === id); if (!en) break;
      sheet = Object.assign(newAdd(en.meal), { edit: en.id, items: [{ id: rnd(), name: en.name, g: en.g, k: en.k, p: en.p, c: en.c, f: en.f }], confirmDel: false }); render(); break; }
    case 'delentry': if (!s.confirmDel) { s.confirmDel = true; render(); } else { S.meals = S.meals.filter((m) => m.id !== s.edit); save(); sheet = null; say('Удалено'); } break;
    case 'savekey': { const v = (s.keyv || '').trim(); if (!v) { s.err = 'Введите код.'; render(); break; } setCode(v); s.nokey = false; s.err = ''; const r = s.retry || 'text'; s.retry = null; runAI(r); break; }
    case 'keyset': sheet = { type: 'keyset', keyv: getCode() }; render(); break;
    case 'savekey2': setCode((s.keyv || '').trim()); sheet = null; say('Код сохранён'); break;
    case 'water': { const d = dayInfo(day), v = Math.max(0, (d.water || 0) + n0(el.dataset.d)); S.days[day] = Object.assign({}, d, { water: v }); save(); render(); break; }
    case 'steps': sheet = { type: 'steps', steps: dayInfo(day).steps || '' }; render(); break;
    case 'savesteps': S.days[day] = Object.assign({}, dayInfo(day), { steps: Math.round(n0(s.steps)) }); save(); sheet = null; render(); break;
    case 'weight': sheet = { type: 'weight', kg: lastWeight() || '' }; render(); break;
    case 'saveweight': { const kg = Math.round(n0(s.kg) * 10) / 10; if (kg <= 20) break; const t = ymd(); S.weights = S.weights.filter((w) => w.date !== t); S.weights.push({ date: t, kg }); S.weights.sort((x, y) => x.date.localeCompare(y.date)); save(); sheet = null; say('Вес записан'); break; }
    case 'start': startTimer(id); break;
    case 'tpause': timerRun.paused = !timerRun.paused; timerRun.last = Date.now(); render(); break;
    case 'tskip': { const t = timerRun; if (t.idx >= t.ph.length - 1) finishTimer(true); else { t.idx++; t.left = t.ph[t.idx].s; render(); } break; }
    case 'tstop': finishTimer(false); break;
    case 'wmanual': sheet = { type: 'wmanual', name: '', min: '', kcal: '' }; render(); break;
    case 'savew': { const min = Math.round(n0(s.min)); S.workouts.push({ id: rnd(), date: ymd(), name: (s.name || '').trim() || 'Тренировка', min, kcal: Math.round(n0(s.kcal)) || Math.round(3.5 * (lastWeight() || 70) * min / 60) }); save(); sheet = null; render(); break; }
    case 'delw': S.workouts = S.workouts.filter((w) => w.id !== id); save(); render(); break;
    case 'profile': sheet = { type: 'profile', p: Object.assign({}, S.profile), kg0: '' }; render(); break;
    case 'usegoal': s.p.goal = n0(el.dataset.v); { const g = document.querySelector('[data-p="goal"]'); if (g) g.value = s.p.goal; } break;
    case 'saveprofile': { S.profile = Object.assign({}, S.profile, s.p, { name: s.p.name.trim() }); const kg = n0(s.kg0);
      if (kg > 20 && !S.weights.length) S.weights.push({ date: ymd(), kg });
      if (s.first && s.p.goal === 1800) S.profile.goal = suggestGoal(S.profile, kg || 70).goal;
      S.onboarded = true; save(); sheet = null; render(); break; }
    case 'backup': sheet = { type: 'backup', blob: JSON.stringify(S) }; render(); break;
    case 'copybk': { const ta = document.getElementById('bk'); if (ta) { ta.select(); ta.setSelectionRange(0, 1e9); }
      if (navigator.clipboard) navigator.clipboard.writeText(s.blob).then(() => say('Скопировано'), () => say('Нажмите «Копировать» в меню выделения')); else say('Нажмите «Копировать» в меню выделения'); break; }
    case 'dorestore': { try { const o = JSON.parse(s.blob); if (!o || !Array.isArray(o.meals)) throw 0; S = normalize(o); S.onboarded = true; save(); sheet = null; say('Данные восстановлены'); } catch { say('Не получилось прочитать текст'); } break; }
    case 'close': closeSheet(); break;
  }
});

/* ---------- старт ---------- */
if (!S.onboarded) sheet = { type: 'profile', p: Object.assign({}, S.profile), kg0: '', first: true };
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body></html>
