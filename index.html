const kcalFor = (p) => Math.round(p.met * (lastWeight() || 70) * (p.min / 60));
function phases(p) {
  const out = [];
  if (p.single) return [{ t: 'work', name: p.ex[0][0], tip: p.ex[0][1], s: p.single }];
  if (p.warm) out.push({ t: 'rest', name: 'Разминка', tip: p.warm, s: 45 });
  p.ex.forEach((e, i) => { out.push({ t: 'work', name: e[0], tip: e[1], s: p.work, i: i + 1, of: p.ex.length }); if (i < p.ex.length - 1) out.push({ t: 'rest', name: 'Отдых', tip: 'Следующее: ' + p.ex[i + 1][0], s: p.rest }); });
  return out;
}
let actx = null, wake = null;
function beep(f = 880, d = 0.12) {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch {}
}
async function startTimer(id) {
  const p = PROGRAMS.find((x) => x.id === id); if (!p) return;
  const ph = phases(p);
  timerRun = { p, ph, idx: 0, left: ph[0].s, paused: false, started: Date.now(), elapsed: 0, last: Date.now() };
  beep(660, 0.2);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch {}
  timerRun.iv = setInterval(tick, 250); render();
}
function tick() {
  const t = timerRun; if (!t || t.paused) { if (t) t.last = Date.now(); return; }
  const now = Date.now(), dt = (now - t.last) / 1000; t.last = now; t.elapsed += dt;
  const before = Math.ceil(t.left); t.left -= dt;
  const after = Math.ceil(t.left);
  if (before !== after && after > 0 && after <= 3) beep(740, 0.08);
  if (t.left <= 0) {
    if (t.idx >= t.ph.length - 1) return finishTimer(true);
    t.idx++; t.left = t.ph[t.idx].s; beep(t.ph[t.idx].t === 'work' ? 988 : 520, 0.25);
    return render();
  }
  if (before !== after) paintTimer();
}
function paintTimer() {
  const t = timerRun, ph = t.ph[t.idx], big = document.querySelector('.timer .big'), bar = document.querySelector('.timer .prog-bar i');
  if (!big) return;
  const s = Math.ceil(t.left); big.textContent = ph.s > 99 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s;
  const total = t.ph.reduce((a, b) => a + b.s, 0), doneS = t.ph.slice(0, t.idx).reduce((a, b) => a + b.s, 0) + (ph.s - t.left);
  bar.style.width = Math.min(100, (doneS / total) * 100) + '%';
}
function finishTimer(done) {
  const t = timerRun; if (!t) return;
  clearInterval(t.iv); try { wake && wake.release(); } catch {} wake = null;
  const min = Math.max(1, Math.round(t.elapsed / 60));
  timerRun = null;
  if (done || min >= 2) {
    const kcal = Math.round(t.p.met * (lastWeight() || 70) * (min / 60));
    S.workouts.push({ id: rnd(), date: ymd(), name: t.p.name, min, kcal }); save();
    sheet = { type: 'done', name: t.p.name, min, kcal, full: done };
  }
  render();
}

/* ---------- расчёт цели ---------- */
function suggestGoal(p, kg) {
  const bmr = 10 * kg + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * p.activity;
  return { tdee: Math.round(tdee), goal: Math.round(Math.max(p.sex === 'm' ? 1500 : 1200, tdee - 500) / 10) * 10 };
}

      ${s.items.length ? `<div class="list">${s.items.map((it) => `<div class="item"><span class="n">${esc(it.name)}<br><span class="small mute">${fmt(n0(it.grams))} г</span></span><span class="k">${fmt(n0(it.kcal))}</span></div>`).join('')}</div>` : ''}` : ''}
    ${s.nokey ? `${s.err ? `<div class="note">${esc(s.err)}</div>` : ''}<div class="ok">Для расчёта по фото нужен бесплатный ключ Google Gemini. Это один раз, около минуты, без карты:<ol><li>Откройте <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> и войдите в Google.</li><li>Нажмите «Create API key» и скопируйте ключ.</li><li>Вставьте его сюда.</li></ol></div><label>Ключ<input data-k="keyv" type="text" placeholder="AIza…" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.keyv || '')}"></label><button class="btn" data-a="savekey">Сохранить и посчитать</button>` : ''}
    ${s.done || s.err || s.nokey ? `${inp('name', 'Название')}<div class="grid2">${inp('kcal', 'Калории', 'number')}${inp('p', 'Белки, г', 'number')}${inp('f', 'Жиры, г', 'number')}${inp('c', 'Углеводы, г', 'number')}</div>` : ''}
    <label>Что на фото? (по желанию)<input data-k="hint" type="text" placeholder="например: гречка 150 г и две котлеты" value="${esc(s.hint)}"></label>
    <button class="btn ghost" data-a="reanalyze" ${s.busy ? 'disabled' : ''}>${s.done || s.err ? 'Посчитать ещё раз' : 'Посчитать'}</button>
    <button class="btn" data-a="addmeal" ${s.kcal > 0 ? '' : 'disabled'}>Добавить в дневник</button><button class="btn soft" data-a="close">Отмена</button>`;
  } else if (s.type === 'manual') {
    body = `<h2>Добавить еду</h2>${inp('name', 'Что съели')}<div class="grid2">${inp('kcal', 'Калории', 'number')}${inp('p', 'Белки, г', 'number')}${inp('f', 'Жиры, г', 'number')}${inp('c', 'Углеводы, г', 'number')}</div>
    <button class="btn" data-a="addmeal" ${n0(s.kcal) > 0 ? '' : 'disabled'}>Добавить</button><button class="btn soft" data-a="close">Отмена</button>`;
  } else if (s.type === 'weight') {
    body = `<h2>Записать вес</h2>${inp('kg', 'Вес, кг', 'number', 'autofocus')}<button class="btn" data-a="saveweight" ${n0(s.kg) > 20 ? '' : 'disabled'}>Сохранить</button><button class="btn soft" data-a="close">Отмена</button>`;
  } else if (s.type === 'steps') {
    body = `<h2>Шаги за день</h2><p class="mute small">Откройте приложение «Здоровье» на iPhone и посмотрите шаги за сегодня.</p>${inp('steps', 'Шагов', 'number', 'autofocus')}<button class="btn" data-a="savesteps">Сохранить</button><button class="btn soft" data-a="close">Отмена</button>`;
  } else if (s.type === 'wmanual') {
    body = `<h2>Своя тренировка</h2>${inp('name', 'Что делали')}<div class="grid2">${inp('min', 'Минут', 'number')}${inp('kcal', 'Ккал (примерно)', 'number')}</div><button class="btn" data-a="savew" ${n0(s.min) > 0 ? '' : 'disabled'}>Сохранить</button><button class="btn soft" data-a="close">Отмена</button>`;
  } else if (s.type === 'backup') {
    body = `<h2>Резервная копия</h2><p class="small mute">Скопируйте текст и сохраните в заметках. Чтобы восстановить данные или перенести на другой телефон, вставьте текст сюда и нажмите «Восстановить».</p>
    <textarea id="bk" data-k="blob" rows="8" spellcheck="false">${esc(s.blob)}</textarea>
    <div class="grid2"><button class="btn ghost" data-a="copybk">Скопировать</button><button class="btn" data-a="dorestore">Восстановить</button></div><button class="btn soft" data-a="close">Закрыть</button>`;
  } else if (s.type === 'done') {
    body = `<h2>${s.full ? 'Готово!' : 'Тренировка записана'}</h2><p>${esc(s.name)}: ${s.min} мин, примерно ${s.kcal} ккал. Запись добавлена в дневник.</p><button class="btn" data-a="close">Отлично</button>`;
  } else if (s.type === 'profile') {
    const p = s.p, sg = suggestGoal(p, lastWeight() || n0(s.kg0) || 70);
    body = `<h2>Настройки</h2>${s.first ? '<p class="mute">Несколько вопросов, чтобы посчитать вашу норму калорий.</p>' : ''}
    <label>Имя<input data-p="name" type="text" value="${esc(p.name)}" placeholder="Как вас называть"></label>
    <div class="grid2"><label>Пол<select data-p="sex"><option value="f" ${p.sex === 'f' ? 'selected' : ''}>Женский</option><option value="m" ${p.sex === 'm' ? 'selected' : ''}>Мужской</option></select></label>
    <label>Возраст<input data-p="age" type="number" inputmode="numeric" value="${p.age}"></label>
    <label>Рост, см<input data-p="height" type="number" inputmode="numeric" value="${p.height}"></label>
    <label>Вес сейчас, кг<input data-p="kg0" type="number" inputmode="decimal" value="${lastWeight() || s.kg0 || ''}" placeholder="например 72"></label></div>
    <label>Активность<select data-p="activity"><option value="1.2" ${p.activity == 1.2 ? 'selected' : ''}>Почти не двигаюсь</option><option value="1.375" ${p.activity == 1.375 ? 'selected' : ''}>Лёгкая, 1-3 тренировки в неделю</option><option value="1.55" ${p.activity == 1.55 ? 'selected' : ''}>Средняя, 3-5 тренировок</option></select></label>
    <div class="ok" id="sg">${sgHtml(sg)}</div>
    <div class="grid2"><label>Цель, ккал в день<input data-p="goal" type="number" inputmode="numeric" value="${p.goal}"></label><label>Желаемый вес, кг<input data-p="weightGoal" type="number" inputmode="decimal" value="${p.weightGoal || ''}"></label></div>
    ${s.first ? '' : `<label>Ключ Google Gemini (для фото)<input data-p="key" type="text" placeholder="AIza…" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.key ?? '')}"></label>
    <p class="small mute">Бесплатный ключ: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Фото уходят в Google. На бесплатном тарифе Google может использовать запросы для улучшения своих продуктов.</p>
    <button class="btn ghost" data-a="backup">Резервная копия данных</button>`}
    <p class="small mute">Калории это ориентир, а не медицинская рекомендация. При заболеваниях цель лучше согласовать с врачом.</p>
    <button class="btn" data-a="saveprofile" ${p.name.trim() ? '' : 'disabled'}>Сохранить</button>${s.first ? '' : '<button class="btn soft" data-a="close">Отмена</button>'}`;
  }
  return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function render() {
  const active = document.activeElement, key = active && (active.dataset.k || active.dataset.p), pos = active && active.selectionStart;
  const views = { today: viewToday, train: viewTrain, progress: viewProgress };
  const tabs = [['today', 'Сегодня'], ['train', 'Тренировки'], ['progress', 'Прогресс']];
  $('#app').innerHTML = `<div class="wrap">${views[tab]()}</div>
  <div class="tabs"><nav>${tabs.map(([k, n]) => `<button data-a="tab" data-id="${k}" aria-current="${tab === k}">${ic(k === 'today' ? 'today' : k === 'train' ? 'train' : 'chart')}${n}</button>`).join('')}</nav></div>
  ${timerRun ? viewTimer() : ''}${viewSheet()}${toast ? `<div class="toast">${esc(toast)}</div>` : ''}`;
  if (key) { const el = document.querySelector(`[data-k="${key}"],[data-p="${key}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
}

/* ---------- события ---------- */
document.addEventListener('input', (e) => {
  const t = e.target; if (!sheet) return;
  if (t.dataset.k) { sheet[t.dataset.k] = t.type === 'number' ? t.value : t.value; if (['kcal', 'kg', 'min'].includes(t.dataset.k)) { const b = document.querySelector('.sheet .btn:not(.ghost):not(.soft)'); if (b) b.disabled = !(n0(t.value) > (t.dataset.k === 'kg' ? 20 : 0)); } }
  if (t.dataset.p) { const k = t.dataset.p; if (k === 'kg0') sheet.kg0 = t.value; else if (k === 'key') sheet.key = t.value; else if (k === 'name' || k === 'sex') sheet.p[k] = t.value; else sheet.p[k] = n0(t.value); if (k === 'name') { const b = document.querySelector('[data-a="saveprofile"]'); if (b) b.disabled = !t.value.trim(); } else paintSuggest(); }
});
document.addEventListener('change', (e) => { const t = e.target; if (t.tagName === 'SELECT' && t.dataset.p && sheet) { sheet.p[t.dataset.p] = t.dataset.p === 'sex' ? t.value : n0(t.value); paintSuggest(); } });
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'scrim') { if (e.target === el && sheet && sheet.type !== 'profile') { sheet = null; render(); } return; }
  if (a !== 'askdel' && a !== 'delmeal') pendingDel = '';
  switch (a) {
    case 'tab': tab = id; day = ymd(); render(); window.scrollTo(0, 0); break;
    case 'prev': day = addDays(day, -1); render(); break;
    case 'next': if (day < ymd()) { day = addDays(day, 1); render(); } break;
    case 'photo': $('#file').click(); break;
    case 'manual': sheet = { type: 'manual', name: '', kcal: '', p: '', f: '', c: '' }; render(); break;
    case 'reanalyze': analyze(); break;
    case 'addmeal': { const s = sheet, k = Math.round(n0(s.kcal)); if (k <= 0) break;
      S.meals.push({ id: rnd(), date: day, time: day === ymd() ? hhmm() : '', name: (s.name || '').trim() || 'Приём пищи', kcal: k, p: Math.round(n0(s.p)), f: Math.round(n0(s.f)), c: Math.round(n0(s.c)) });
      save(); sheet = null; say('Добавлено'); break; }
    case 'askdel': pendingDel = id; render(); break;
    case 'delmeal': S.meals = S.meals.filter((m) => m.id !== id); pendingDel = ''; save(); render(); break;
    case 'water': { const d = dayInfo(day), v = Math.max(0, (d.water || 0) + n0(el.dataset.d)); S.days[day] = Object.assign({}, d, { water: v }); save(); render(); break; }
    case 'steps': sheet = { type: 'steps', steps: dayInfo(day).steps || '' }; render(); break;
    case 'savesteps': S.days[day] = Object.assign({}, dayInfo(day), { steps: Math.round(n0(sheet.steps)) }); save(); sheet = null; render(); break;
    case 'weight': sheet = { type: 'weight', kg: lastWeight() || '' }; render(); break;
    case 'saveweight': { const kg = Math.round(n0(sheet.kg) * 10) / 10; if (kg <= 20) break; const t = ymd(); S.weights = S.weights.filter((w) => w.date !== t); S.weights.push({ date: t, kg }); S.weights.sort((x, y) => x.date.localeCompare(y.date)); save(); sheet = null; say('Вес записан'); break; }
    case 'start': startTimer(id); break;
    case 'tpause': timerRun.paused = !timerRun.paused; timerRun.last = Date.now(); render(); break;
    case 'tskip': { const t = timerRun; if (t.idx >= t.ph.length - 1) finishTimer(true); else { t.idx++; t.left = t.ph[t.idx].s; render(); } break; }
    case 'tstop': finishTimer(false); break;
    case 'wmanual': sheet = { type: 'wmanual', name: '', min: '', kcal: '' }; render(); break;
    case 'savew': { const s = sheet, min = Math.round(n0(s.min)); S.workouts.push({ id: rnd(), date: ymd(), name: (s.name || '').trim() || 'Тренировка', min, kcal: Math.round(n0(s.kcal)) || Math.round(3.5 * (lastWeight() || 70) * min / 60) }); save(); sheet = null; render(); break; }
    case 'delw': S.workouts = S.workouts.filter((w) => w.id !== id); save(); render(); break;
    case 'profile': sheet = { type: 'profile', p: Object.assign({}, S.profile), kg0: '', key: getKey() }; render(); break;
    case 'savekey': { const v = (sheet.keyv || '').trim(); if (v.length < 20) { sheet.err = 'Ключ слишком короткий. Скопируйте его целиком.'; render(); break; } setKey(v); sheet.err = ''; analyze(); break; }
    case 'backup': sheet = { type: 'backup', blob: JSON.stringify(S) }; render(); break;
    case 'copybk': { const ta = document.getElementById('bk'); if (ta) { ta.select(); ta.setSelectionRange(0, 1e9); }
      if (navigator.clipboard) navigator.clipboard.writeText(sheet.blob).then(() => say('Скопировано'), () => say('Нажмите «Копировать» в меню выделения')); else say('Нажмите «Копировать» в меню выделения'); break; }
    case 'dorestore': { try { const o = JSON.parse(sheet.blob); if (!o || !Array.isArray(o.meals)) throw 0; S = normalize(o); S.onboarded = true; save(); sheet = null; say('Данные восстановлены'); } catch { say('Не получилось прочитать текст'); } break; }
    case 'usegoal': sheet.p.goal = n0(el.dataset.v); { const g = document.querySelector('[data-p="goal"]'); if (g) g.value = sheet.p.goal; } break;
    case 'saveprofile': { const s = sheet; S.profile = Object.assign({}, S.profile, s.p, { name: s.p.name.trim() }); const kg = n0(s.kg0);
      if (kg > 20 && !S.weights.length) S.weights.push({ date: ymd(), kg });
      if (s.first && s.p.goal === 1800) { S.profile.goal = suggestGoal(S.profile, kg || 70).goal; }
      if (s.key !== undefined) setKey((s.key || '').trim());
      S.onboarded = true; save(); sheet = null; render(); break; }
    case 'close': sheet = null; render(); break;
  }
});

/* ---------- старт ---------- */
if (!S.onboarded) sheet = { type: 'profile', p: Object.assign({}, S.profile), kg0: '', first: true };
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body></html>
